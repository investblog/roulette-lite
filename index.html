<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roulette-lite — playground</title>
<meta name="description" content="A roulette wheel drawn by code: seeded geometry, brand-aware colours, line or flat, as an SVG string.">
<style>
	:root { --bg: #111318; --panel: #1a1d24; --text: #e6e6e6; --muted: #9aa0aa; --line: #2b2f38; --accent: #00abf3; }
	body.light { --bg: #f4f5f8; --panel: #ffffff; --text: #1d2026; --muted: #5d6470; --line: #dfe2e8; --accent: #0084bd; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
	main { display: grid; grid-template-columns: 18rem 1fr; min-height: 100vh; }
	aside { padding: 16px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
	h1 { font-size: 16px; margin: 0; }
	label { display: grid; grid-template-columns: 6rem 1fr; align-items: center; gap: 8px; color: var(--muted); }
	input[type=text], select { width: 100%; padding: 4px 6px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
	.row { display: flex; gap: 6px; }
	button { padding: 4px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	.brand input { width: 2.2rem; height: 1.6rem; padding: 0; border: 0; background: none; }
	#stage { display: grid; place-items: center; padding: 24px; }
	#stage > svg { width: min(80vh, 100%); height: auto; }
	#stage.sheet { grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); align-items: start; gap: 16px; }
	#stage.sheet figure { margin: 0; text-align: center; color: var(--muted); font-size: 12px; cursor: pointer; }
	#stage.sheet svg { width: 100%; height: auto; display: block; }
	#stage.table { display: block; align-content: start; }
	/* #stage sets place-items:center, and Chrome applies justify-items to block containers too — the band would shrink to the SVG default 300px without this */
	#stage.table .band { position: relative; width: 100%; }
	#stage.table .band > svg { width: 100%; height: auto; }
	#stage.table .wheel { position: absolute; right: 3%; top: 50%; transform: translateY(-50%); width: 28%; }
	#stage.table .wheel svg { width: 100%; height: auto; }
	.meta { color: var(--muted); font-size: 12px; }
	.marks { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
	.marks span { display: inline-block; }
	.marks svg { width: 100%; height: 100%; display: block; }
	.marks .logo { display: flex; align-items: center; gap: 6px; font-weight: 600; }
	footer { margin-top: auto; color: var(--muted); font-size: 12px; }
	a { color: var(--accent); }
	@media (max-width: 48rem) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
	<aside id="panel">
		<h1>roulette-lite</h1>
		<label>seed <input type="text" data-k="seed" value="1"></label>
		<div class="row"><button id="prev">‹</button><button id="roll">roll</button><button id="next">›</button></div>
		<label>show <select id="mode"><option value="one">one wheel</option><option value="sheet">contact sheet (24)</option><option value="table">wheel on the table</option></select></label>
		<label>theme <select data-k="theme"><option>dark</option><option>light</option></select></label>
		<label class="brand">brand <span class="row"><input type="color" data-b="0" value="#00abf3"><input type="color" data-b="1" value="#d6af3c"><input type="color" data-b="2" value="#a91455"><button id="spintax" title="spintax triad">↺</button></span></label>
		<label>style <select data-k="style"><option>flat</option><option>line</option></select></label>
		<label>view <select data-k="view"><option>tilt</option><option>top</option></select></label>
		<label>tilt <span class="row"><input type="range" data-k="tilt" min="0" max="60" step="1" value="50"><input type="checkbox" data-auto="tilt" checked title="seeded"></span></label>
		<label>roll <span class="row"><input type="range" data-k="roll" min="-30" max="30" step="1" value="0"><input type="checkbox" data-auto="roll" checked title="seeded"></span></label>
		<label>variant <select data-k="variant"><option>european</option><option>american</option><option>auto</option></select></label>
		<label>detail <select data-k="detail"><option value="1">1 silhouette</option><option value="2" selected>2 standard</option><option value="3">3 everything</option></select></label>
		<label>motion <select data-k="motion"><option value="off">off</option><option value="on">wheel + ball</option><option value="rotor">wheel</option><option value="ball">ball</option></select></label>
		<label>speed <input type="range" data-k="speed" min="0" max="12" step="0.5" value="1"></label>
		<label>weight <input type="range" data-k="weight" min="0.4" max="2.5" step="0.1" value="1"></label>
		<label>glow <input type="checkbox" data-k="glow" checked></label>
		<p class="meta" id="bytes"></p>
		<div id="marks" class="marks"></div>
		<footer>Made in <a href="https://301.st">301</a> · for <a href="https://spintax.net">spintax.net</a></footer>
	</aside>
	<section id="stage"></section>
</main>
<script src="roulette.js"></script>
<script>
	(function () {
		var TRIAD = ['#00abf3', '#d6af3c', '#a91455'];
		var opts = { seed: '1', theme: 'dark', brand: TRIAD.slice(), style: 'flat', view: 'tilt', tilt: 'auto', roll: 'auto', motion: false, speed: 1, variant: 'european', detail: 2, weight: 1, glow: true };
		var stage = document.getElementById('stage'), mode = document.getElementById('mode');
		var seedInput = document.querySelector('[data-k=seed]');

		function seedValue() { return /^\d+$/.test(opts.seed) ? Number(opts.seed) : opts.seed; }
		function render() {
			document.body.classList.toggle('light', opts.theme === 'light');
			var o = Object.assign({}, opts, { seed: seedValue() });
			if (mode.value === 'sheet') {
				stage.className = 'sheet';
				var base = typeof o.seed === 'number' ? o.seed : 1, html = '';
				for (var i = 0; i < 24; i++) {
					var s = base + i;
					html += '<figure data-seed="' + s + '">' + Roulette.svg(Object.assign({}, o, { seed: s })) + '<figcaption>seed ' + s + '</figcaption></figure>';
				}
				stage.innerHTML = html;
			} else if (mode.value === 'table') {
				// the pair as a page would use it: the layout as the band, the wheel standing on it
				stage.className = 'table';
				stage.innerHTML = '<div class="band">' + Roulette.table(o) + '<div class="wheel">' + Roulette.svg(o) + '</div></div>';
				document.getElementById('bytes').textContent = Roulette.table(o).length + ' bytes of table SVG';
			} else {
				stage.className = '';
				var out = Roulette.svg(o);
				stage.innerHTML = out;
				document.getElementById('bytes').textContent = out.length + ' bytes of SVG';
				// the same seed as an emblem: a favicon on its badge at 16, 32, 64, and the mono logo
				var fav = Roulette.mark({ seed: o.seed, brand: o.brand, theme: o.theme, badge: true });
				document.getElementById('marks').innerHTML = [16, 32, 64].map(function (z) {
					return '<span style="width:' + z + 'px;height:' + z + 'px">' + fav + '</span>';
				}).join('') + '<span class="logo"><span style="width:22px;height:22px">' +
					Roulette.mark({ seed: o.seed, mono: true }) + '</span>example.com</span>';
			}
		}
		function setSeed(v) { opts.seed = String(v); seedInput.value = opts.seed; render(); }

		document.getElementById('panel').addEventListener('input', function (e) {
			var t = e.target, k = t.getAttribute('data-k'), b = t.getAttribute('data-b');
			var auto = t.getAttribute('data-auto');
			if (auto) opts[auto] = t.checked ? 'auto' : Number(document.querySelector('[data-k=' + auto + ']').value);
			else if (b != null) opts.brand[+b] = t.value;
			else if (k === 'glow') opts.glow = t.checked;
			else if (k === 'tilt' || k === 'roll') { opts[k] = Number(t.value); document.querySelector('[data-auto=' + k + ']').checked = false; }
			else if (k === 'motion') opts.motion = t.value === 'off' ? false : t.value === 'on' ? true : t.value;
			else if (k === 'detail' || k === 'weight' || k === 'speed') opts[k] = Number(t.value);
			else if (k) opts[k] = t.value;
			render();
		});
		mode.addEventListener('change', render);
		document.getElementById('roll').onclick = function () { setSeed(Math.floor(Math.random() * 1e6)); };
		document.getElementById('prev').onclick = function () { var v = seedValue(); setSeed(typeof v === 'number' ? Math.max(0, v - (mode.value === 'sheet' ? 24 : 1)) : 1); };
		document.getElementById('next').onclick = function () { var v = seedValue(); setSeed(typeof v === 'number' ? v + (mode.value === 'sheet' ? 24 : 1) : 1); };
		document.getElementById('spintax').onclick = function () {
			opts.brand = TRIAD.slice();
			document.querySelectorAll('[data-b]').forEach(function (el, i) { el.value = TRIAD[i]; });
			render();
		};
		stage.addEventListener('click', function (e) {
			var f = e.target.closest('figure');
			if (f) { mode.value = 'one'; setSeed(f.getAttribute('data-seed')); }
		});
		render();
	})();
</script>
</body>
</html>
